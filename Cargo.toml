[package]
name = "ternaryshell"
version = "1.4.4"
edition = "2024"
description = "Lightweight SSH/SFTP client for macOS"
license = "MIT"
repository = "https://github.com/ilhamnadhif/ternaryshell"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
dirs = "7.0.0"
# The renderer is chosen per system below: Metal (wgpu) on macOS, OpenGL elsewhere (it starts
# faster and keeps the binary small), with Direct3D 12 as the fallback on Windows.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts"] }
egui_extras = { version = "0.36.2", default-features = false }
getrandom = "0.4.3"
hmac = "0.13.0"
keyring = { version = "4.2.0", default-features = false, features = ["apple-native-keyring-store", "v1"] }
log = "0.4.34"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
rfd = "0.17.2"
# RSA logins are signed with ring (constant time); see src/ssh/rsa_sign.rs. Both are already
# used by russh, at these versions.
ring = "0.17.14"
rsa = "=0.10.0-rc.18"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-util = "0.7.20"
skrifa = "0.44.0"
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4", "serde", "v5"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# The menu bar and window details exist on macOS only. The AppKit bindings (already in the
# dependency tree via winit) are used by the debug-only end-to-end test driver, which injects
# real keyboard and mouse events.
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu"] }
muda = "0.21.2"
winit = "0.30"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSGraphicsContext"] }

# OpenGL, on X11 or Wayland, whichever the session runs (both are loaded at run time, so the
# binary links neither).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "x11", "wayland"] }

# OpenGL, and Direct3D 12 (only that wgpu backend) for machines without OpenGL 2 (virtual
# machines, Remote Desktop, no graphics driver). windows-sys lists the network interfaces, for
# noticing network changes (already in the dependency tree).
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

# The icon and version information of ternaryshell.exe (Explorer, the taskbar, Start menu shortcuts).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
signature = "3.0.0"
tempfile = "3.27.0"

# Dependencies are built optimized even in dev builds: Argon2, the terminal parser and the
# renderer are far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
# Keep unwinding: a panic inside one session's task must not take the whole app down.
panic = "unwind"
[profile.release.package.winit]
opt-level = "s"
[profile.release.package.muda]
opt-level = "s"
[profile.release.package.rfd]
opt-level = "s"
[profile.release.package.objc2-app-kit]
opt-level = "s"
[profile.release.package.objc2-foundation]
opt-level = "s"

# ssh-key with a fix for ECDSA keys whose private scalar OpenSSH stored without leading zero
# bytes (about one P-256 key in 256); see vendor/ssh-key/TERNARYSHELL-PATCH.md.
[patch.crates-io]
ssh-key = { path = "vendor/ssh-key" }
