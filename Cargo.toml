[package]
name = "peler"
version = "1.0.0"
edition = "2024"
description = "Lightweight SSH/SFTP client for macOS"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui_extras = { version = "0.36.2", default-features = false }
getrandom = "0.4.3"
keyring = { version = "4.2.0", default-features = false, features = ["apple-native-keyring-store", "v1"] }
log = "0.4.34"
memmap2 = "0.9.11"
muda = "0.21.2"
parking_lot = "0.12.5"
rfd = "0.17.2"
russh = "0.64.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
uuid = { version = "1.28.0", features = ["v4", "serde", "v5"] }
winit = "0.30"

# AppKit bindings (already in the dependency tree via winit): used by the debug-only
# end-to-end test driver that injects real keyboard and mouse events.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSGraphicsContext"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny-skia = "0.12.0"

# Dependencies are built optimized even in dev builds: Argon2, the terminal parser and the
# renderer are far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
# Keep unwinding: a panic inside one session's task must not take the whole app down.
panic = "unwind"

# Size-optimize large dependencies that are not on a hot path (shader translation, GPU setup,
# font parsing, accessibility). Keeps the universal .app comfortably under 30 MB.
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.wgpu-core]
opt-level = "s"
[profile.release.package.wgpu-hal]
opt-level = "s"
[profile.release.package.wgpu]
opt-level = "s"
[profile.release.package.accesskit_consumer]
opt-level = "s"
[profile.release.package.accesskit_macos]
opt-level = "s"
[profile.release.package.read-fonts]
opt-level = "s"
[profile.release.package.winit]
opt-level = "s"
[profile.release.package.muda]
opt-level = "s"
[profile.release.package.rfd]
opt-level = "s"
[profile.release.package.skrifa]
opt-level = "s"
[profile.release.package.harfrust]
opt-level = "s"
[profile.release.package.vello_common]
opt-level = "s"
[profile.release.package.vello_cpu]
opt-level = "s"
[profile.release.package.objc2-app-kit]
opt-level = "s"
[profile.release.package.objc2-foundation]
opt-level = "s"
[profile.release.package.accesskit]
opt-level = "s"
